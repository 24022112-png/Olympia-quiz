<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vượt Chướng Ngại Vật - Olympia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Hiệu ứng lật miếng ghép mượt mà */
    .tile-cover {
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: center;
    }
    .tile-open {
      opacity: 0 !important;
      transform: scale(0.3) rotate(20deg) !important;
      pointer-events: none !important;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-3 md:p-6 font-sans flex flex-col items-center justify-center">

  <!-- Audio Chơi Nhạc Lật Ô -->
  <audio id="revealAudio" src="VCNV_mở_hình_ảnh_O11.mp3" preload="auto"></audio>

  <!-- Header -->
  <div class="w-full max-w-5xl flex justify-between items-center mb-3 bg-slate-900 border border-slate-800 p-3 rounded-xl shadow-lg">
    <div>
      <h1 class="text-lg sm:text-2xl font-black text-amber-400 uppercase tracking-wider">
        🧩 Vượt Chướng Ngại Vật
      </h1>
      <p class="text-xs text-slate-400">Click vào ô 1, 2, 3, 4, 5 để lật mở miếng ghép</p>
    </div>
    <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-lg border border-slate-700 transition font-bold">
      ⬅️ Màn chính
    </a>
  </div>

  <!-- KHI VÙNG HÌNH ẢNH & MIẾNG GHÉP CHE KÍN 100% -->
  <div class="w-full max-w-5xl relative aspect-video bg-white rounded-xl border-4 border-amber-400 shadow-2xl overflow-hidden select-none">
    
    <!-- 1. Bức ảnh Đáp án bên dưới -->
    <img 
      id="obstacleImg" 
      src="Đáp án.png" 
      alt="Đáp án Chướng ngại vật" 
      class="w-full h-full object-contain p-4 relative z-0"
    />

    <!-- 2. Lớp 4 Miếng Ghép Góc (1, 2, 3, 4) - CHE KÍN 100% KHÔNG CÓ KẼ HỞ -->
    <div class="absolute inset-0 grid grid-cols-2 grid-rows-2 z-10 gap-0 p-0">
      
      <!-- Ô số 1 -->
      <div id="tile-1" onclick="toggleTile(1)" class="tile-cover w-full h-full bg-gradient-to-br from-blue-900 via-slate-900 to-indigo-950 border border-amber-400/40 flex items-center justify-center cursor-pointer hover:brightness-125">
        <span class="text-5xl sm:text-7xl font-black text-amber-400 font-mono drop-shadow-[0_4px_10px_rgba(0,0,0,0.9)] pointer-events-none">1</span>
      </div>

      <!-- Ô số 2 -->
      <div id="tile-2" onclick="toggleTile(2)" class="tile-cover w-full h-full bg-gradient-to-br from-blue-900 via-slate-900 to-indigo-950 border border-amber-400/40 flex items-center justify-center cursor-pointer hover:brightness-125">
        <span class="text-5xl sm:text-7xl font-black text-amber-400 font-mono drop-shadow-[0_4px_10px_rgba(0,0,0,0.9)] pointer-events-none">2</span>
      </div>

      <!-- Ô số 3 -->
      <div id="tile-3" onclick="toggleTile(3)" class="tile-cover w-full h-full bg-gradient-to-br from-blue-900 via-slate-900 to-indigo-950 border border-amber-400/40 flex items-center justify-center cursor-pointer hover:brightness-125">
        <span class="text-5xl sm:text-7xl font-black text-amber-400 font-mono drop-shadow-[0_4px_10px_rgba(0,0,0,0.9)] pointer-events-none">3</span>
      </div>

      <!-- Ô số 4 -->
      <div id="tile-4" onclick="toggleTile(4)" class="tile-cover w-full h-full bg-gradient-to-br from-blue-900 via-slate-900 to-indigo-950 border border-amber-400/40 flex items-center justify-center cursor-pointer hover:brightness-125">
        <span class="text-5xl sm:text-7xl font-black text-amber-400 font-mono drop-shadow-[0_4px_10px_rgba(0,0,0,0.9)] pointer-events-none">4</span>
      </div>

    </div>

    <!-- 3. Ô số 5 Trung tâm - CHE TRUNG TÂM -->
    <div id="tile-5" onclick="toggleTile(5)" class="tile-cover absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-2/5 h-2/5 z-20 bg-gradient-to-br from-amber-500 via-yellow-400 to-amber-600 border-4 border-slate-950 rounded-2xl flex items-center justify-center cursor-pointer shadow-[0_0_50px_rgba(0,0,0,0.9)] hover:scale-105">
      <span class="text-5xl sm:text-7xl font-black text-slate-950 font-mono pointer-events-none drop-shadow">5</span>
    </div>

  </div>

  <!-- Thanh Đổi Ảnh & Nút Mở/🔒 -->
  <div class="w-full max-w-5xl mt-3 bg-slate-900 border border-slate-800 p-3 rounded-xl shadow-xl flex flex-col md:flex-row items-center justify-between gap-3">
    <div class="flex-1 w-full flex items-center gap-2">
      <input 
        type="text" 
        id="imgUrlInput" 
        placeholder="Dán URL ảnh mới..." 
        class="w-full bg-slate-950 border border-slate-700 text-slate-200 text-xs rounded-lg px-3 py-2 focus:outline-none focus:border-amber-400"
      />
      <button onclick="changeImageByUrl()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs px-3 py-2 rounded-lg whitespace-nowrap cursor-pointer">
        Đổi Ảnh
      </button>
      <label class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs px-3 py-2 rounded-lg border border-slate-700 cursor-pointer whitespace-nowrap">
        📁 Chọn File
        <input type="file" accept="image/*" class="hidden" onchange="uploadLocalImage(event)" />
      </label>
    </div>

    <div class="flex items-center gap-2 w-full md:w-auto justify-end">
      <button onclick="resetAllTiles()" class="bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold text-xs px-4 py-2 rounded-lg border border-slate-700 cursor-pointer">
        🔒 Đóng Tất Cả
      </button>
      <button onclick="openAllTiles()" class="bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-400 font-bold text-xs px-4 py-2 rounded-lg border border-emerald-500/40 cursor-pointer">
        🔓 Mở Tất Cả
      </button>
    </div>
  </div>

  <!-- Script xử lý Lật ảnh & Âm thanh -->
  <script>
    const tileStates = { 1: false, 2: false, 3: false, 4: false, 5: false };

    // Hàm phát âm thanh khi lật
    function playSound() {
      const audio = document.getElementById('revealAudio');
      if (audio) {
        audio.currentTime = 0;
        audio.play().catch(e => {
          console.warn("Không tìm thấy file audio mp3, phát âm thanh mặc định:", e);
          playFallbackSynthSound();
        });
      }
    }

    // Âm thanh dự phòng (Tự tạo sóng âm khi thiếu file .mp3)
    function playFallbackSynthSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.5, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      } catch (err) {}
    }

    function toggleTile(num) {
      tileStates[num] = !tileStates[num];
      const el = document.getElementById(`tile-${num}`);
      if (!el) return;

      if (tileStates[num]) {
        el.classList.add('tile-open');
        playSound(); // Phát âm thanh khi mở
      } else {
        el.classList.remove('tile-open');
      }
    }

    function openAllTiles() {
      playSound();
      for (let i = 1; i <= 5; i++) {
        tileStates[i] = true;
        const el = document.getElementById(`tile-${i}`);
        if (el) el.classList.add('tile-open');
      }
    }

    function resetAllTiles() {
      for (let i = 1; i <= 5; i++) {
        tileStates[i] = false;
        const el = document.getElementById(`tile-${i}`);
        if (el) el.classList.remove('tile-open');
      }
    }

    function changeImageByUrl() {
      const input = document.getElementById('imgUrlInput');
      const val = input ? input.value.trim() : '';
      if (!val) {
        alert('Vui lòng nhập URL ảnh!');
        return;
      }
      const img = document.getElementById('obstacleImg');
      if (img) {
        img.src = val;
        resetAllTiles();
      }
    }

    function uploadLocalImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        const img = document.getElementById('obstacleImg');
        if (img) {
          img.src = e.target.result;
          resetAllTiles();
        }
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
