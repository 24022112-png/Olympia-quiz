<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vượt Chướng Ngại Vật - Olympia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Hiệu ứng lật mở miếng ghép mượt mà */
    .tile-cover {
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease-in-out;
      transform-origin: center;
    }
    .tile-open {
      opacity: 0 !important;
      transform: scale(0.2) rotate(15deg) !important;
      pointer-events: none !important;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-2 md:p-6 font-sans flex flex-col items-center justify-center">

  <!-- Audio Chơi Nhạc Lật Ô -->
  <audio id="revealAudio" src="VCNV_mở_hình_ảnh_O11.mp3" preload="auto"></audio>

  <!-- Header -->
  <div class="w-full max-w-5xl flex justify-between items-center mb-3 bg-slate-900 border border-slate-800 p-3 rounded-xl shadow-lg">
    <div>
      <h1 class="text-lg sm:text-2xl font-black text-amber-400 uppercase tracking-wider">
        🧩 Vượt Chướng Ngại Vật
      </h1>
      <p class="text-xs text-slate-400">Click vào ô 1, 2, 3, 4, 5 để lật mở mảnh ghép</p>
    </div>
    <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-lg border border-slate-700 transition font-bold">
      ⬅️ Màn chính
    </a>
  </div>

  <!-- KHUNG HÌNH ẢNH VÀ MẢNH GHÉP CHE KÍN 100% -->
  <div class="w-full max-w-5xl relative aspect-video bg-white rounded-xl border-4 border-amber-400 shadow-2xl overflow-hidden select-none">
    
    <!-- Bức ảnh Đáp án mới -->
    <img 
      id="obstacleImg" 
      src="Đáp án VCNV.jpg" 
      alt="Đáp án Chướng ngại vật" 
      class="w-full h-full object-contain p-2 relative z-0"
    />

    <!-- Lớp 4 Mảnh Ghép (1, 2, 3, 4) - CHE KÍN HOÀN TOÀN KHÔNG KẼ HỞ -->
    <div class="absolute inset-0 grid grid-cols-2 grid-rows-2 gap-0 p-0 m-0 z-10 w-full h-full">
      
      <!-- Ô số 1 (Góc trên trái) -->
      <div id="tile-1" onclick="toggleTile(1)" class="tile-cover w-full h-full bg-slate-900 border-[0.5px] border-slate-800 flex items-center justify-center cursor-pointer hover:bg-slate-800">
        <span class="text-6xl sm:text-8xl font-black text-amber-400 font-mono drop-shadow-[0_4px_10px_rgba(0,0,0,0.9)] pointer-events-none">1</span>
      </div>

      <!-- Ô số 2 (Góc trên phải) -->
      <div id="tile-2" onclick="toggleTile(2)" class="tile-cover w-full h-full bg-slate-900 border-[0.5px] border-slate-800 flex items-center justify-center cursor-pointer hover:bg-slate-800">
        <span class="text-6xl sm:text-8xl font-black text-amber-400 font-mono drop-shadow-[0_4px_10px_rgba(0,0,0,0.9)] pointer-events-none">2</span>
      </div>

      <!-- Ô số 3 (Góc dưới trái) -->
      <div id="tile-3" onclick="toggleTile(3)" class="tile-cover w-full h-full bg-slate-900 border-[0.5px] border-slate-800 flex items-center justify-center cursor-pointer hover:bg-slate-800">
        <span class="text-6xl sm:text-8xl font-black text-amber-400 font-mono drop-shadow-[0_4px_10px_rgba(0,0,0,0.9)] pointer-events-none">3</span>
      </div>

      <!-- Ô số 4 (Góc dưới phải) -->
      <div id="tile-4" onclick="toggleTile(4)" class="tile-cover w-full h-full bg-slate-900 border-[0.5px] border-slate-800 flex items-center justify-center cursor-pointer hover:bg-slate-800">
        <span class="text-6xl sm:text-8xl font-black text-amber-400 font-mono drop-shadow-[0_4px_10px_rgba(0,0,0,0.9)] pointer-events-none">4</span>
      </div>

    </div>

    <!-- Ô số 5 Trung tâm -->
    <div id="tile-5" onclick="toggleTile(5)" class="tile-cover absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-2/5 h-2/5 z-20 bg-gradient-to-br from-amber-500 via-yellow-400 to-amber-600 border-4 border-slate-950 rounded-2xl flex items-center justify-center cursor-pointer shadow-[0_0_50px_rgba(0,0,0,0.9)] hover:scale-105">
      <span class="text-6xl sm:text-8xl font-black text-slate-950 font-mono pointer-events-none drop-shadow">5</span>
    </div>

  </div>

  <!-- Thanh Điều Khiển -->
  <div class="w-full max-w-5xl mt-3 bg-slate-900 border border-slate-800 p-3 rounded-xl shadow-xl flex flex-col md:flex-row items-center justify-between gap-3">
    <div class="flex-1 w-full flex items-center gap-2">
      <input 
        type="text" 
        id="imgUrlInput" 
        placeholder="Dán URL ảnh mới..." 
        class="w-full bg-slate-950 border border-slate-700 text-slate-200 text-xs rounded-lg px-3 py-2 focus:outline-none focus:border-amber-400"
      />
      <button onclick="changeImageByUrl()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs px-3 py-2 rounded-lg whitespace-nowrap cursor-pointer">
        Đổi Ảnh
      </button>
      <label class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs px-3 py-2 rounded-lg border border-slate-700 cursor-pointer whitespace-nowrap">
        📁 Chọn File
        <input type="file" accept="image/*" class="hidden" onchange="uploadLocalImage(event)" />
      </label>
    </div>

    <div class="flex items-center gap-2 w-full md:w-auto justify-end">
      <button onclick="resetAllTiles()" class="bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold text-xs px-4 py-2 rounded-lg border border-slate-700 cursor-pointer">
        🔒 Đóng Tất Cả
      </button>
      <button onclick="openAllTiles()" class="bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-400 font-bold text-xs px-4 py-2 rounded-lg border border-emerald-500/40 cursor-pointer">
        🔓 Mở Tất Cả
      </button>
    </div>
  </div>

  <!-- Script Lật ô & Phát âm thanh -->
  <script>
    const tileStates = { 1: false, 2: false, 3: false, 4: false, 5: false };

    // Phát âm thanh khi lật ô
    function playSound() {
      const audio = document.getElementById('revealAudio');
      if (audio) {
        audio.currentTime = 0;
        audio.play().catch(() => playFallbackSynthSound());
      } else {
        playFallbackSynthSound();
      }
    }

    // Âm thanh giả lập chuẩn nếu không tải được mp3
    function playFallbackSynthSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(350, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(850, ctx.currentTime + 0.35);
        gain.gain.setValueAtTime(0.4, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.35);
      } catch (err) {}
    }

    function toggleTile(num) {
      tileStates[num] = !tileStates[num];
      const el = document.getElementById(`tile-${num}`);
      if (!el) return;

      if (tileStates[num]) {
        el.classList.add('tile-open');
        playSound();
      } else {
        el.classList.remove('tile-open');
      }
    }

    function openAllTiles() {
      playSound();
      for (let i = 1; i <= 5; i++) {
        tileStates[i] = true;
        const el = document.getElementById(`tile-${i}`);
        if (el) el.classList.add('tile-open');
      }
    }

    function resetAllTiles() {
      for (let i = 1; i <= 5; i++) {
        tileStates[i] = false;
        const el = document.getElementById(`tile-${i}`);
        if (el) el.classList.remove('tile-open');
      }
    }

    function changeImageByUrl() {
      const input = document.getElementById('imgUrlInput');
      const val = input ? input.value.trim() : '';
      if (!val) {
        alert('Vui lòng nhập URL ảnh!');
        return;
      }
      const img = document.getElementById('obstacleImg');
      if (img) {
        img.src = val;
        resetAllTiles();
      }
    }

    function uploadLocalImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        const img = document.getElementById('obstacleImg');
        if (img) {
          img.src = e.target.result;
          resetAllTiles();
        }
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
