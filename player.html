<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thí Sinh - Đường Lên Đỉnh Olympia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Firebase SDK (v8) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="js/firebase-config.js"></script>

  <style>
    .buzzer-btn {
      transition: all 0.1s ease;
      box-shadow: 0 10px 0 #991b1b, 0 15px 25px rgba(0,0,0,0.5);
    }
    .buzzer-btn:active:not(:disabled) {
      transform: translateY(6px);
      box-shadow: 0 4px 0 #991b1b, 0 5px 10px rgba(0,0,0,0.5);
    }
    .buzzer-disabled {
      box-shadow: 0 6px 0 #475569 !important;
      transform: translateY(4px);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col items-center p-3 sm:p-6">

  <!-- Modal Đăng Nhập Tên Thí Sinh -->
  <div id="loginModal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-amber-400/40 p-6 rounded-2xl max-w-md w-full shadow-2xl text-center">
      <h2 class="text-2xl font-black text-amber-400 uppercase tracking-wider mb-2">🏆 Đăng Nhập Thí Sinh</h2>
      <p class="text-xs text-slate-400 mb-6">Nhập họ tên của bạn để bước vào phòng thi Olympia</p>
      
      <form onsubmit="handlePlayerLogin(event)" class="space-y-4">
        <input 
          type="text" 
          id="playerNameInput" 
          placeholder="Nhập tên thí sinh..." 
          required
          maxlength="20"
          class="w-full bg-slate-950 border border-slate-700 text-slate-200 text-sm rounded-xl p-3 focus:outline-none focus:border-amber-400 text-center font-bold"
        />
        <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-yellow-400 hover:from-amber-600 hover:to-yellow-500 text-slate-950 font-black text-sm py-3 rounded-xl shadow-lg transition transform active:scale-95 cursor-pointer">
          VÀO PHÒNG THI ➔
        </button>
      </form>
    </div>
  </div>

  <!-- Màn Hình Chính Của Thí Sinh -->
  <div id="app" class="w-full max-w-2xl flex flex-col items-center gap-4 hidden">
    
    <!-- Top Bar: Thông tin Thí Sinh & Điểm Số -->
    <div class="w-full bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-xl flex items-center justify-between">
      <div>
        <span class="text-[10px] text-slate-400 uppercase tracking-widest block">Thí Sinh</span>
        <h2 id="displayPlayerName" class="text-lg font-black text-amber-400 truncate max-w-[180px]">---</h2>
      </div>

      <!-- Khung Điểm Số Olympia -->
      <div class="flex flex-col items-center">
        <span class="text-[10px] text-amber-400/80 font-bold uppercase tracking-wider">Điểm Số</span>
        <div class="bg-gradient-to-b from-blue-900 to-slate-950 border-2 border-amber-400 px-4 py-1 rounded-xl shadow-inner">
          <span id="displayPlayerScore" class="text-2xl font-extrabold text-blue-400 font-mono">0</span>
        </div>
      </div>

      <button onclick="playerLogout()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-red-400 p-2 rounded-lg border border-slate-700 transition">
        🚪 Thoát
      </button>
    </div>

    <!-- Trạng Thái Chuông -->
    <div id="statusBadge" class="text-xs font-bold px-4 py-1.5 rounded-full bg-red-500/20 text-red-400 border border-red-500/30">
      🔒 CHUÔNG ĐANG KHÓA
    </div>

    <!-- NÚT BẤM CHUÔNG KHỔNG LỒ -->
    <div class="my-4 flex flex-col items-center justify-center w-full">
      <button 
        id="buzzerBtn" 
        onclick="pressBuzzer()" 
        disabled 
        class="buzzer-btn buzzer-disabled w-56 h-56 sm:w-64 sm:h-64 rounded-full bg-gradient-to-b from-red-500 via-red-600 to-red-800 border-4 border-red-400 text-white font-black text-2xl sm:text-3xl tracking-wider flex flex-col items-center justify-center gap-2 cursor-not-allowed select-none opacity-60"
      >
        <span class="text-4xl sm:text-5xl">🔔</span>
        <span id="buzzerBtnText">KHÓA</span>
      </button>
    </div>

    <!-- KHUNG GỬI CÂU TRẢ LỜI -->
    <div class="w-full bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-xl flex flex-col gap-2">
      <label for="answerInput" class="text-xs font-bold text-slate-400 uppercase tracking-wider flex justify-between">
        <span>💬 Trả lời câu hỏi:</span>
        <span id="chatStatus" class="text-amber-400"></span>
      </label>
      <div class="flex gap-2">
        <input 
          type="text" 
          id="answerInput" 
          placeholder="Nhập câu trả lời tại đây..." 
          class="flex-1 bg-slate-950 border border-slate-700 text-slate-200 text-sm rounded-xl px-4 py-3 focus:outline-none focus:border-amber-400"
          onkeypress="if(event.key === 'Enter') submitAnswer()"
        />
        <button 
          id="sendAnswerBtn"
          onclick="submitAnswer()" 
          class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-black text-sm px-5 py-3 rounded-xl shadow-lg transition active:scale-95 cursor-pointer whitespace-nowrap"
        >
          GỬI ➔
        </button>
      </div>
    </div>

  </div>

  <!-- Script xử lý Realtime cho Thí Sinh -->
  <script>
    let playerId = sessionStorage.getItem("olympia_player_id");
    let playerName = sessionStorage.getItem("olympia_player_name");
    let isLocked = true;
    let isMutedBuzzer = false;
    let isMutedChat = false;

    const buzzerAudio = new Audio('sound/buzzer.mp3');

    document.addEventListener("DOMContentLoaded", () => {
      initPlayerAuth();
    });

    function initPlayerAuth() {
      const modal = document.getElementById("loginModal");
      const app = document.getElementById("app");

      if (playerId && playerName) {
        if (modal) modal.classList.add("hidden");
        if (app) app.classList.remove("hidden");
        document.getElementById("displayPlayerName").innerText = playerName;
        startPlayerFirebase();
      } else {
        if (modal) modal.classList.remove("hidden");
        if (app) app.classList.add("hidden");
      }
    }

    function handlePlayerLogin(e) {
      e.preventDefault();
      const input = document.getElementById("playerNameInput");
      const name = input ? input.value.trim() : "";
      
      if (!name) return;

      playerId = 'player_' + Math.random().toString(36).substr(2, 9);
      playerName = name;

      sessionStorage.setItem("olympia_player_id", playerId);
      sessionStorage.setItem("olympia_player_name", playerName);

      // Đăng ký thông tin thí sinh lên Firebase Database
      db.ref(`players/${playerId}`).set({
        name: playerName,
        score: 0,
        joinedAt: Date.now(),
        muteBuzzer: false,
        muteChat: false,
        kicked: false
      });

      initPlayerAuth();
    }

    function playerLogout() {
      if (playerId) {
        db.ref(`players/${playerId}`).remove();
      }
      sessionStorage.removeItem("olympia_player_id");
      sessionStorage.removeItem("olympia_player_name");
      window.location.reload();
    }

    function startPlayerFirebase() {
      // 1. Lắng nghe trạng thái Khóa/Mở Chuông từ Admin
      db.ref('settings/locked').on('value', (snapshot) => {
        isLocked = snapshot.val() ?? true;
        updateBuzzerUI();
      });

      // 2. Lắng nghe dữ liệu bản thân (Điểm số, Cấm chuông, Cấm chat, Kick)
      db.ref(`players/${playerId}`).on('value', (snapshot) => {
        if (!snapshot.exists()) return;
        const data = snapshot.val();

        if (data.kicked) {
          alert("Bạn đã bị quản trị viên mời ra khỏi phòng thi!");
          playerLogout();
          return;
        }

        // Cập nhật điểm số
        document.getElementById("displayPlayerScore").innerText = data.score !== undefined ? data.score : 0;
        
        // Cập nhật trạng thái cấm
        isMutedBuzzer = !!data.muteBuzzer;
        isMutedChat = !!data.muteChat;

        const chatInput = document.getElementById("answerInput");
        const sendBtn = document.getElementById("sendAnswerBtn");
        const chatStatus = document.getElementById("chatStatus");

        if (isMutedChat) {
          if (chatInput) chatInput.disabled = true;
          if (sendBtn) sendBtn.disabled = true;
          if (chatStatus) chatStatus.innerText = "(Bị cấm chat)";
        } else {
          if (chatInput) chatInput.disabled = false;
          if (sendBtn) sendBtn.disabled = false;
          if (chatStatus) chatStatus.innerText = "";
        }

        updateBuzzerUI();
      });
    }

    function updateBuzzerUI() {
      const btn = document.getElementById("buzzerBtn");
      const badge = document.getElementById("statusBadge");
      const btnText = document.getElementById("buzzerBtnText");

      if (isLocked || isMutedBuzzer) {
        btn.disabled = true;
        btn.className = "buzzer-btn buzzer-disabled w-56 h-56 sm:w-64 sm:h-64 rounded-full bg-slate-800 border-4 border-slate-600 text-slate-500 font-black text-2xl sm:text-3xl tracking-wider flex flex-col items-center justify-center gap-2 cursor-not-allowed select-none opacity-60";
        btnText.innerText = isMutedBuzzer ? "BỊ CẤM" : "KHÓA";
        
        badge.innerText = isMutedBuzzer ? "🔇 BẠN ĐÃ BỊ CẤM CHUÔNG" : "🔒 CHUÔNG ĐANG KHÓA";
        badge.className = "text-xs font-bold px-4 py-1.5 rounded-full bg-red-500/20 text-red-400 border border-red-500/30";
      } else {
        btn.disabled = false;
        btn.className = "buzzer-btn w-56 h-56 sm:w-64 sm:h-64 rounded-full bg-gradient-to-b from-red-500 via-red-600 to-red-800 border-4 border-red-400 text-white font-black text-2xl sm:text-3xl tracking-wider flex flex-col items-center justify-center gap-2 cursor-pointer select-none animate-pulse hover:brightness-110 active:scale-95";
        btnText.innerText = "BẤM CHUÔNG!";

        badge.innerText = "🔓 CHUÔNG ĐANG MỞ - SẴN SÀNG!";
        badge.className = "text-xs font-bold px-4 py-1.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 animate-bounce";
      }
    }

    function pressBuzzer() {
      if (isLocked || isMutedBuzzer) return;

      // Phát âm thanh bấm chuông tại máy thí sinh
      buzzerAudio.currentTime = 0;
      buzzerAudio.play().catch(e => console.log(e));

      // Gửi tín hiệu bấm chuông về Firebase
      db.ref(`buzzers/${playerId}`).set({
        name: playerName,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      });
    }

    function submitAnswer() {
      if (isMutedChat) return;

      const input = document.getElementById("answerInput");
      const text = input ? input.value.trim() : "";
      if (!text) return;

      db.ref("answers").push({
        playerId: playerId,
        name: playerName,
        text: text,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      });

      input.value = "";
    }
  </script>
</body>
</html>
