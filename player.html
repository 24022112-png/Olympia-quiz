<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vượt Chướng Ngại Vật - Lật Ảnh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Hiệu ứng lật mở ô */
    .tile-cover {
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: center;
    }
    .tile-open {
      opacity: 0 !important;
      transform: scale(0.5) rotate(15deg) !important;
      pointer-events: none !important;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8 font-sans flex flex-col items-center justify-center">

  <!-- Header -->
  <div class="w-full max-w-4xl flex justify-between items-center mb-4 bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-lg">
    <div>
      <h1 class="text-xl sm:text-2xl font-black text-amber-400 uppercase tracking-wider">
        🧩 Vượt Chướng Ngại Vật
      </h1>
      <p class="text-xs text-slate-400 mt-1">Click trực tiếp vào ô số 1, 2, 3, 4, 5 để lật ảnh</p>
    </div>
    <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-lg border border-slate-700 transition font-bold">
      ⬅️ Trang chính
    </a>
  </div>

  <!-- Khung Bức Ảnh & 5 Miếng Ghép -->
  <div class="w-full max-w-4xl relative aspect-video bg-slate-900 rounded-2xl border-4 border-amber-400/80 shadow-2xl overflow-hidden select-none">
    
    <!-- Bức ảnh chướng ngại vật phía dưới -->
    <img 
      id="obstacleImg" 
      src="https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=1200&auto=format&fit=crop" 
      alt="Chướng ngại vật" 
      class="w-full h-full object-cover relative z-0"
    />

    <!-- Lớp 4 Ô góc (1, 2, 3, 4) -->
    <div class="absolute inset-0 p-2 grid grid-cols-2 grid-rows-2 gap-2 z-10">
      <div id="tile-1" onclick="toggleTile(1)" class="tile-cover bg-gradient-to-br from-blue-950 via-slate-900 to-indigo-950 border-2 border-amber-400/80 rounded-xl flex items-center justify-center cursor-pointer shadow-xl hover:brightness-125 active:scale-95">
        <span class="text-4xl sm:text-6xl font-black text-amber-400 font-mono pointer-events-none">1</span>
      </div>

      <div id="tile-2" onclick="toggleTile(2)" class="tile-cover bg-gradient-to-br from-blue-950 via-slate-900 to-indigo-950 border-2 border-amber-400/80 rounded-xl flex items-center justify-center cursor-pointer shadow-xl hover:brightness-125 active:scale-95">
        <span class="text-4xl sm:text-6xl font-black text-amber-400 font-mono pointer-events-none">2</span>
      </div>

      <div id="tile-3" onclick="toggleTile(3)" class="tile-cover bg-gradient-to-br from-blue-950 via-slate-900 to-indigo-950 border-2 border-amber-400/80 rounded-xl flex items-center justify-center cursor-pointer shadow-xl hover:brightness-125 active:scale-95">
        <span class="text-4xl sm:text-6xl font-black text-amber-400 font-mono pointer-events-none">3</span>
      </div>

      <div id="tile-4" onclick="toggleTile(4)" class="tile-cover bg-gradient-to-br from-blue-950 via-slate-900 to-indigo-950 border-2 border-amber-400/80 rounded-xl flex items-center justify-center cursor-pointer shadow-xl hover:brightness-125 active:scale-95">
        <span class="text-4xl sm:text-6xl font-black text-amber-400 font-mono pointer-events-none">4</span>
      </div>
    </div>

    <!-- Ô số 5 Trung tâm -->
    <div id="tile-5" onclick="toggleTile(5)" class="tile-cover absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-1/3 h-1/3 z-20 bg-gradient-to-br from-amber-500 via-yellow-400 to-amber-600 border-4 border-slate-950 rounded-2xl flex items-center justify-center cursor-pointer shadow-2xl hover:scale-105 active:scale-95">
      <span class="text-4xl sm:text-6xl font-black text-slate-950 font-mono pointer-events-none">5</span>
    </div>

  </div>

  <!-- Thanh Điều Khiển -->
  <div class="w-full max-w-4xl mt-4 bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-xl flex flex-col md:flex-row items-center justify-between gap-3">
    <div class="flex-1 w-full flex items-center gap-2">
      <input 
        type="text" 
        id="imgUrlInput" 
        placeholder="Nhập URL ảnh mới..." 
        class="w-full bg-slate-950 border border-slate-700 text-slate-200 text-xs rounded-lg px-3 py-2.5 focus:outline-none focus:border-amber-400"
      />
      <button onclick="changeImageByUrl()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-xs px-4 py-2.5 rounded-lg whitespace-nowrap transition cursor-pointer">
        Đổi Ảnh
      </button>
      <label class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs px-3 py-2.5 rounded-lg border border-slate-700 cursor-pointer whitespace-nowrap transition">
        📁 Tải Ảnh
        <input type="file" accept="image/*" class="hidden" onchange="uploadLocalImage(event)" />
      </label>
    </div>

    <div class="flex items-center gap-2 w-full md:w-auto justify-end">
      <button onclick="resetAllTiles()" class="bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold text-xs px-4 py-2.5 rounded-lg border border-slate-700 transition cursor-pointer">
        🔒 Đóng Tất Cả
      </button>
      <button onclick="openAllTiles()" class="bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-400 font-bold text-xs px-4 py-2.5 rounded-lg border border-emerald-500/40 transition cursor-pointer">
        🔓 Mở Tất Cả
      </button>
    </div>
  </div>

  <!-- Script xử lý trực tiếp -->
  <script>
    const tileStates = { 1: false, 2: false, 3: false, 4: false, 5: false };

    function toggleTile(num) {
      tileStates[num] = !tileStates[num];
      const el = document.getElementById(`tile-${num}`);
      if (!el) return;

      if (tileStates[num]) {
        el.classList.add('tile-open');
      } else {
        el.classList.remove('tile-open');
      }
    }

    function openAllTiles() {
      for (let i = 1; i <= 5; i++) {
        tileStates[i] = true;
        const el = document.getElementById(`tile-${i}`);
        if (el) el.classList.add('tile-open');
      }
    }

    function resetAllTiles() {
      for (let i = 1; i <= 5; i++) {
        tileStates[i] = false;
        const el = document.getElementById(`tile-${i}`);
        if (el) el.classList.remove('tile-open');
      }
    }

    function changeImageByUrl() {
      const input = document.getElementById('imgUrlInput');
      const val = input ? input.value.trim() : '';
      if (!val) {
        alert('Vui lòng nhập đường dẫn URL ảnh!');
        return;
      }
      const img = document.getElementById('obstacleImg');
      if (img) {
        img.src = val;
        resetAllTiles();
      }
    }

    function uploadLocalImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        const img = document.getElementById('obstacleImg');
        if (img) {
          img.src = e.target.result;
          resetAllTiles();
        }
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
