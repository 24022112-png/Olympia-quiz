<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Trị - Đấu Trường Olympia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDK 8.x -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body id="appBody" class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-6 pb-12 flex items-center justify-center">

  <!-- ================= FORM ĐĂNG NHẬP BẮT BUỘC ================= -->
  <div id="loginCard" class="bg-slate-900 border border-slate-800 p-8 rounded-2xl max-w-sm w-full space-y-5 text-center shadow-2xl">
    <div class="w-16 h-16 bg-amber-500/10 border border-amber-500/20 text-amber-400 rounded-full flex items-center justify-center mx-auto text-2xl font-black">
      🔐
    </div>
    <div>
      <h2 class="text-xl font-black text-amber-400">XÁC NHẬN ADMIN</h2>
      <p class="text-xs text-slate-400 mt-1">Nhập mật khẩu quản trị viên để tiếp tục</p>
    </div>

    <div class="space-y-3">
      <input id="adminPasswordInput" type="password" placeholder="Nhập mật khẩu..." 
        onkeydown="if(event.key === 'Enter') loginAdmin()"
        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500 text-center tracking-widest">
      
      <p id="authErrorNotice" class="text-xs text-red-500 font-bold min-h-[16px]"></p>

      <button onclick="loginAdmin()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl text-sm transition shadow-lg shadow-amber-500/10">
        ĐĂNG NHẬP
      </button>
    </div>

    <a href="index.html" class="block text-xs text-slate-500 hover:text-slate-400 transition">
      ← Quay lại trang chủ
    </a>
  </div>

  <!-- ================= TEMPLATE GIAO DIỆN ADMIN (ẨN HOÀN TOÀN TRONG BỘ NHỚ) ================= -->
  <template id="adminTemplate">
    <div class="max-w-5xl mx-auto space-y-6 w-full">

      <!-- HEADER ADMIN -->
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex justify-between items-center shadow-lg">
        <div>
          <h1 class="text-xl font-black text-amber-400">BẢNG QUẢN TRỊ OLYMPIA</h1>
          <p class="text-xs text-slate-400">Đồng bộ chuông & quản lý thí sinh thời gian thực</p>
        </div>
        <div class="flex items-center gap-3">
          <div id="statusBadge" class="text-xs font-bold px-3 py-1.5 rounded-lg bg-red-500/20 text-red-400 border border-red-500/30">
            🔒 CHUÔNG ĐANG KHÓA
          </div>
          <button onclick="logoutAdmin()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-3 py-1.5 rounded-lg transition font-bold">
            🚪 Đăng xuất
          </button>
        </div>
      </div>

      <!-- KHU VỰC TÁC VỤ ĐIỀU HÀNH -->
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl shadow-lg grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="space-y-2">
          <label class="text-xs text-slate-400 font-semibold block">ĐIỀU KHIỂN CHUÔNG</label>
          <div class="flex gap-2">
            <button onclick="setBuzzerLock(false)" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg text-xs transition">
              🔓 MỞ CHUÔNG
            </button>
            <button onclick="setBuzzerLock(true)" class="flex-1 bg-red-600 hover:bg-red-500 text-white font-bold py-2 rounded-lg text-xs transition">
              🔒 KHÓA CHUÔNG
            </button>
          </div>
        </div>

        <div class="space-y-2">
          <label class="text-xs text-slate-400 font-semibold block">DỌN DẸP DỮ LIỆU</label>
          <div class="flex gap-2">
            <button onclick="clearBuzzers()" class="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-amber-400 font-bold py-2 rounded-lg text-xs transition">
              🧹 XÓA CHUÔNG
            </button>
            <button onclick="clearAnswers()" class="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 font-bold py-2 rounded-lg text-xs transition">
              🗑️ XÓA CÂU TRẢ LỜI
            </button>
          </div>
        </div>

        <div class="space-y-2">
          <label class="text-xs text-slate-400 font-semibold block">SỐ THÍ SINH TỐI ĐA (0 = KHÔNG GIỚI HẠN)</label>
          <div class="flex gap-2">
            <input id="maxPlayersInput" type="number" min="0" placeholder="Số thí sinh..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-amber-500">
            <button onclick="updateMaxPlayers()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-3 py-1.5 rounded-lg text-xs transition">
              LƯU
            </button>
          </div>
        </div>
      </div>

      <!-- CÁC BẢNG THEO DÕI REALTIME -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- DANH SÁCH THỨ TỰ CHUÔNG BẤM -->
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-lg">
          <h3 class="font-bold text-sm text-amber-400 mb-3 flex justify-between items-center">
            <span>🔔 TÍN HIỆU CHUÔNG</span>
            <span id="buzzerCount" class="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded">0</span>
          </h3>
          <ul id="adminBuzzerList" class="space-y-2 max-h-80 overflow-y-auto pr-1">
            <li class="text-slate-500 italic text-xs">Chưa có tín hiệu chuông nào...</li>
          </ul>
        </div>

        <!-- QUẢN LÝ THÍ SINH -->
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-lg lg:col-span-2">
          <h3 class="font-bold text-sm text-slate-200 mb-3 flex justify-between items-center">
            <span>👥 QUẢN LÝ THÍ SINH PHÒNG THI</span>
            <span id="playerCount" class="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded">0 thí sinh</span>
          </h3>
          <div class="overflow-x-auto">
            <table class="w-full text-xs text-left">
              <thead class="uppercase bg-slate-950 text-slate-400 border-b border-slate-800">
                <tr>
                  <th class="p-2">Thí sinh</th>
                  <th class="p-2 text-center">Cấm Chuông</th>
                  <th class="p-2 text-center">Cấm Chat</th>
                  <th class="p-2 text-center">Thao tác</th>
                </tr>
              </thead>
              <tbody id="playerTableBody" class="divide-y divide-slate-800">
                <tr><td colspan="4" class="p-3 text-center text-slate-500 italic">Đang tải danh sách thí sinh...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>

      <!-- DANH SÁCH CÂU TRẢ LỜI ĐÃ GỬI -->
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-lg">
        <h3 class="font-bold text-sm text-slate-200 mb-3">💬 CÂU TRẢ LỜI CỦA THÍ SINH (REALTIME)</h3>
        <div id="adminAnswerStream" class="space-y-2 max-h-60 overflow-y-auto pr-1">
          <p class="text-slate-500 italic text-xs">Chưa có câu trả lời nào...</p>
        </div>
      </div>

    </div>
  </template>

  <!-- LOAD SCRIPTS -->
  <script src="js/firebase-config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
