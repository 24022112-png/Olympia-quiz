<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Trị Viên - Đấu Trường Olympia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDK 8.x -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-6 pb-12">

  <!-- MODAL ĐĂNG NHẬP ADMIN -->
  <div id="loginModal" class="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-sm w-full space-y-4 text-center shadow-2xl">
      <div class="w-12 h-12 bg-amber-500/10 text-amber-500 rounded-full flex items-center justify-center mx-auto text-xl">
        🔑
      </div>
      <h2 class="text-xl font-bold text-slate-100">Đăng Nhập Quản Trị</h2>
      <p class="text-xs text-slate-400">Nhập mật khẩu Admin để truy cập hệ thống điều khiển Olympia</p>
      
      <div>
        <input id="adminPasswordInput" type="password" placeholder="Mật khẩu Admin..." onkeydown="if(event.key === 'Enter') handleAdminLogin()"
          class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500 text-center tracking-widest">
        <p id="loginError" class="text-xs text-red-500 mt-2 hidden">Mật khẩu không chính xác!</p>
      </div>

      <button onclick="handleAdminLogin()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2 rounded-lg text-sm transition shadow">
        Đăng Nhập
      </button>
    </div>
  </div>

  <!-- NỘI DUNG BẢNG QUẢN TRỊ OLYMPIA -->
  <template id="adminContent">
    <div class="max-w-5xl mx-auto space-y-6">
      
      <!-- HEADER ADMIN -->
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex flex-wrap justify-between items-center gap-4 shadow-xl">
        <div>
          <span class="text-xs text-amber-500 font-semibold tracking-wider uppercase">Hệ Thống Điều Khiển</span>
          <h1 class="text-xl font-bold text-slate-100">Bảng Quản Trị Olympia</h1>
        </div>
        <div class="flex items-center gap-3">
          <span id="statusBadge" class="text-xs font-bold px-3 py-1.5 rounded-lg bg-red-500/20 text-red-400 border border-red-500/30">
            🔒 CHUÔNG ĐANG KHÓA
          </span>
          <button onclick="adminLogout()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition">
            Đăng xuất
          </button>
        </div>
      </div>

      <!-- ĐIỀU KHIỂN NHANH -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        
        <!-- Quản lý chuông -->
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-lg space-y-3">
          <h2 class="font-bold text-sm text-slate-300 flex items-center gap-2">🔔 Quản Lý Chuông</h2>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="setBuzzerLock(false)" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-3 rounded-lg text-xs transition shadow">
              🔓 MỞ CHUÔNG
            </button>
            <button onclick="setBuzzerLock(true)" class="bg-red-600 hover:bg-red-500 text-white font-bold py-2 px-3 rounded-lg text-xs transition shadow">
              🔒 KHÓA CHUÔNG
            </button>
          </div>
          <button onclick="clearBuzzers()" class="w-full bg-slate-800 hover:bg-slate-700 text-amber-400 border border-slate-700 font-bold py-2 rounded-lg text-xs transition">
            🧹 Xóa Danh Sách Chuông
          </button>
        </div>

        <!-- Giới hạn thí sinh -->
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-lg space-y-3">
          <h2 class="font-bold text-sm text-slate-300 flex items-center gap-2">⚙️ Giới Hạn Thí Sinh</h2>
          <div class="flex gap-2">
            <input id="maxPlayersInput" type="number" min="0" placeholder="0 = Không giới hạn" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-amber-500">
            <button onclick="updateMaxPlayers()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-3 py-1.5 rounded-lg text-xs whitespace-nowrap transition">
              Lưu
            </button>
          </div>
          <p class="text-[10px] text-slate-500">Nhập 0 nếu không muốn giới hạn số người.</p>
        </div>

        <!-- Quản lý Chat -->
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-lg space-y-3">
          <h2 class="font-bold text-sm text-slate-300 flex items-center gap-2">💬 Dữ Liệu Câu Trả Lời</h2>
          <button onclick="clearAnswers()" class="w-full bg-slate-800 hover:bg-slate-700 text-red-400 border border-slate-700 font-bold py-2.5 rounded-lg text-xs transition">
            🗑️ Xóa Tất Cả Câu Trả Lời
          </button>
        </div>

      </div>

      <!-- QUẢN LÝ THÍ SINH & ĐIỂM SỐ -->
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-lg">
        <div class="flex justify-between items-center mb-4">
          <h2 class="font-bold text-sm text-slate-300 flex items-center gap-2">👥 Danh Sách Thí Sinh & Điểm Số</h2>
          <span id="playerCount" class="text-xs text-amber-400 font-bold">0 thí sinh</span>
        </div>
        
        <div class="overflow-x-auto">
          <table class="w-full text-xs text-left">
            <thead class="uppercase bg-slate-950 text-slate-400 border-b border-slate-800">
              <tr>
                <th class="p-2.5">Thí sinh</th>
                <th class="p-2.5 text-center">Điểm</th>
                <th class="p-2.5 text-center">Cấm Chuông</th>
                <th class="p-2.5 text-center">Cấm Chat</th>
                <th class="p-2.5 text-center">Đuổi</th>
              </tr>
            </thead>
            <tbody id="playerTableBody" class="divide-y divide-slate-800">
              <tr><td colspan="5" class="p-4 text-center text-slate-500 italic">Đang tải dữ liệu thí sinh...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- DANH SÁCH BẤM CHUÔNG & NHẬT KÝ CHAT REALTIME -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        
        <!-- Thứ tự bấm chuông -->
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-lg">
          <div class="flex justify-between items-center mb-3">
            <h2 class="font-bold text-sm text-slate-300 flex items-center gap-2">⏱️ Thứ Tự Bấm Chuông</h2>
            <span id="buzzerCount" class="text-xs bg-amber-500/20 text-amber-400 font-bold px-2 py-0.5 rounded border border-amber-500/30">0</span>
          </div>
          <ul id="adminBuzzerList" class="space-y-2 max-h-60 overflow-y-auto pr-1">
            <li class="text-slate-500 italic text-xs">Chưa có tín hiệu chuông nào...</li>
          </ul>
        </div>

        <!-- Nhật ký câu trả lời -->
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-lg">
          <h2 class="font-bold text-sm text-slate-300 mb-3 flex items-center gap-2">💬 Câu Trả Lời Trực Tuyến</h2>
          <div id="adminAnswerStream" class="space-y-2 max-h-60 overflow-y-auto pr-1">
            <p class="text-slate-500 italic text-xs">Chưa có câu trả lời nào...</p>
          </div>
        </div>

      </div>

    </div>
  </template>

  <!-- Container nhận giao diện sau khi đăng nhập -->
  <div id="app"></div>

  <!-- SCRIPT KẾT NỐI -->
  <script src="js/firebase-config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
